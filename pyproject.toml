[project]
name = "saas-revenue-intelligence"
version = "0.1.0"
description = "Reproducible B2B SaaS subscription revenue and customer growth analytics platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1,<2",
  "openpyxl>=3.1,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pyarrow>=15,<26",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "joblib>=1.3,<2",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<5"]
airflow = ["apache-airflow>=2.9,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<3", "types-PyYAML>=6,<7", "types-openpyxl>=3.1,<4", "pillow>=10,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true

# scikit-learn, statsmodels, scipy, seaborn and pandas ship without complete stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*", "scipy.*", "seaborn.*", "matplotlib.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true
